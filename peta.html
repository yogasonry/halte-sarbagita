async function aesEncrypt(plaintext) {
  var enc = new TextEncoder();
  var keyData = enc.encode(AES_KEY);
  var iv = keyData.slice(0, 16);
  var cryptoKey = await crypto.subtle.importKey("raw", keyData, { name: "AES-CBC" }, false, ["encrypt"]);
  var encrypted = await crypto.subtle.encrypt({ name: "AES-CBC", iv: iv }, cryptoKey, enc.encode(plaintext));
  var binary = "";
  var bytes = new Uint8Array(encrypted);
  for (var i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}

async function aesDecrypt(b64) {
  var enc = new TextEncoder();
  var keyData = enc.encode(AES_KEY);
  var iv = keyData.slice(0, 16);
  var cryptoKey = await crypto.subtle.importKey("raw", keyData, { name: "AES-CBC" }, false, ["decrypt"]);
  var binary = atob(b64);
  var bytes = new Uint8Array(binary.length);
  for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  var decrypted = await crypto.subtle.decrypt({ name: "AES-CBC", iv: iv }, cryptoKey, bytes);
  return new TextDecoder().decode(decrypted);
}

async function getDirectGpsToken() {
  if (gpsDirectToken) return gpsDirectToken;
  var userJson = JSON.stringify({ id: "0", email: "" });
  var encBody = await aesEncrypt(userJson);
  var res = await fetch("https://gps.brtnusantara.com:6013/api/authToken", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ value: encBody })
  });
  if (!res.ok) throw new Error("GPS authentication unavailable");
  var cipher = await res.text();
  var parsed = JSON.parse(await aesDecrypt(cipher));
  gpsDirectToken = parsed.data.token;
  return gpsDirectToken;
}

async function pollDirectGps() {
  if (liveGpsPollBusy) return;
  liveGpsPollBusy = true;
  try {
    var token = await getDirectGpsToken();
    var encBody = await aesEncrypt(JSON.stringify({ key: "NGIxBali", pref: "14" }));
    var res = await fetch("https://gps.brtnusantara.com:6013/api/findAll", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": token },
      body: JSON.stringify({ value: encBody })
    });
    if (res.status === 401 || res.status === 403) {
      gpsDirectToken = null;
      throw new Error("GPS token expired");
    }
    if (!res.ok) throw new Error("GPS service unavailable");
    var json = await res.json();
    if (json && Array.isArray(json.data)) {
      var now = Date.now();
      var dt = now - lastLivePush;
      if (dt >= 2000 && dt <= 15000) liveInterval = dt;
      lastLivePush = now;
      isLiveGps = true;
      liveSarbagitaBuses = json.data
        .filter(function(b) { return b.pref === "14" && b.lat && b.lng; })
        .map(function(b) {
          return {
            id: b.id,
            lat: b.lat,
            lng: b.lng,
            angle: Number(b.angle) || 0,
            speed: b.speed || 0,
            corridor: b.kor || "S1",
            toward: b.toward || "",
            plate: b.plate_number || "",
            name: b.name || "",
            updated: b.dt_tracker || ""
          };
        });
      buses();
    } else throw new Error("Invalid GPS response");
  } catch (err) {
    console.warn("Direct GPS:", err);
  } finally {
    liveGpsPollBusy = false;
  }
}

  setInterval(pollDirectGps, 5000);
}

function getDistanceMeters(lat1, lon1, lat2, lon2) {
  var R = 6371e3;
  var dLat = (lat2 - lat1) * Math.PI / 180;
  var dLon = (lon2 - lon1) * Math.PI / 180;
  var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
          Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function lerpAngle(fromA, toA, t) {
  var diff = ((toA - fromA + 540) % 360) - 180;
  return (fromA + diff * t + 360) % 360;
}

function startLiveAnimLoop() {
  function frame(now) {
    for (var entry of liveAnimStates.entries()) {
      var s = entry[1];
      if (!s.animating) continue;
      var elapsed = now - s.startTime;
      var progress = Math.min(1, elapsed / s.duration);
      var curLat = s.fromLat + (s.toLat - s.fromLat) * progress;
      var curLng = s.fromLng + (s.toLng - s.fromLng) * progress;
      s.marker.setLatLng([curLat, curLng]);
      var curAngle = lerpAngle(s.fromAngle, s.toAngle, progress);
      s.curAngle = curAngle;
      var el = s.marker.getElement();
      if (el) {
        var ico = el.querySelector(".bus-ico-rot");
        if (ico) ico.style.transform = "rotate(" + curAngle + "deg)";
      }
      if (progress >= 1) {
        s.animating = false;
        s.fromLat = s.toLat;
        s.fromLng = s.toLng;
        s.fromAngle = s.toAngle;
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
